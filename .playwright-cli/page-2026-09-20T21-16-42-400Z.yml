ticle> <article class="game-card game-card--pacman"> <span class="game-card__mark" aria-hidden="true">●</span> <p class="game-card__eyebrow">Arcade · Maze chase</p> <h3>Pac-Man</h3> <p>A compact browser remake of the maze-chase original, built around the familiar dots, ghosts, and tight corners.</p> <a class="game-action" href="/games/pacman/">Start the chase <span aria-hidden="true">→</span></a> </article> </div>
